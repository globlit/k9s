apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow
  labels:
    app: slow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: slow
  template:
    metadata:
      labels:
        app: slow
    spec:
      # sleep ignores SIGTERM: each pod takes the full grace period to stop.
      terminationGracePeriodSeconds: 8
      containers:
        - name: sleep
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
