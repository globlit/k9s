apiVersion: v1
kind: Pod
metadata:
  name: json-logs
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: logger
      image: busybox:1.36.1
      command:
        - sh
        - -c
        - |
          while true; do
            printf '%s\n' '{"level":"info","msg":"ordinary-message","n":9007199254740993}' '{"level":"error","msg":"error-message [red]","error":"timeout, retry"}'
            sleep 1
          done
      resources:
        requests: {cpu: 10m, memory: 4Mi}
        limits: {cpu: 100m, memory: 32Mi}
