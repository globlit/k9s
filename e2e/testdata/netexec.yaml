apiVersion: v1
kind: Pod
metadata:
  name: netexec
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: netexec
      image: registry.k8s.io/e2e-test-images/agnhost:2.52
      args: ["netexec", "--http-port=8080"]
      ports:
        - name: http
          containerPort: 8080
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
      resources:
        requests:
          cpu: 1m
          memory: 8Mi
