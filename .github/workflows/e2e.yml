name: K9s E2E

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_DIR: /tmp/k9s-e2e
      K9S_E2E_ARTIFACTS: ${{ github.workspace }}/.e2e-artifacts
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          build-cache: e2e

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1

      - name: Build before starting the cluster
        run: make e2e-build

      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          cluster_name: k9s-e2e
          config: e2e/kind.yaml
          wait: 180s

      - name: Cap cluster resources
        run: make e2e-kind-up

      - name: Run e2e tests
        run: make e2e-run

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-captures
          path: ${{ env.K9S_E2E_ARTIFACTS }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
