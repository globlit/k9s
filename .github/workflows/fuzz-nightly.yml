name: K9s Fuzz Nightly

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List fuzz targets
        id: list
        run: echo "matrix=$(hack/fuzz-targets.sh)" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    name: ${{ matrix.target }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Fuzz
        env:
          PKG: ${{ matrix.pkg }}
          TARGET: ${{ matrix.target }}
        run: go test -run '^$' -fuzz "^${TARGET}\$" -fuzztime 60s -parallel 2 "$PKG"

      - name: Locate generated corpus
        if: always()
        run: echo "FUZZ_CACHE=$(go env GOCACHE)/fuzz" >> "$GITHUB_ENV"

      - name: Upload fuzz evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            ${{ matrix.pkg }}/testdata/fuzz/${{ matrix.target }}
            ${{ env.FUZZ_CACHE }}
          if-no-files-found: ignore
          retention-days: 30

  fuzz-complete:
    if: always()
    needs: [targets, fuzz]
    runs-on: ubuntu-latest
    steps:
      - name: Require every target
        env:
          TARGET_RESULT: ${{ needs.targets.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: test "$TARGET_RESULT" = success && test "$FUZZ_RESULT" = success
