name: K9s Test

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - rc*
  pull_request:
    branches:
      - master
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          build-cache: coverage

      - name: Setup GO env
        run: go env -w CGO_ENABLED=0

      - name: Test harness gates
        run: make test-harness

      - name: Run Tests
        run: GOMAXPROCS=4 go test -count=1 -p 2 -timeout 10m -coverprofile=coverage.out ./...
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          build-cache: cross

      - name: Vet linux/arm
        run: GOOS=linux GOARCH=arm go vet ./cmd/...

      - name: Build linux/386
        run: GOOS=linux GOARCH=386 go build ./...

      - name: Build darwin/arm64
        run: GOOS=darwin GOARCH=arm64 go build ./...

      - name: Build windows/amd64
        run: GOOS=windows GOARCH=amd64 go build ./...

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          build-cache: race

      - name: Run Tests With Race Detector
        run: make test-race

  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          build-cache: resources
      - name: Check retained resources
        run: make test-resource | tee resources.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: resources
          path: resources.txt
