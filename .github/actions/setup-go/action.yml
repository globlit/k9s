name: Set up Go
description: Share modules and retain build caches by job.
inputs:
  build-cache:
    description: Identify the job's build mode.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      id: go
      with:
        go-version-file: go.mod
        cache: false

    - id: paths
      shell: bash
      run: |
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "image=${ImageOS:-$RUNNER_OS}" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      id: modules
      with:
        path: ${{ steps.paths.outputs.modules }}
        key: go-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: |
          go-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-

    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: go mod download

    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ steps.paths.outputs.build }}
        key: go-build-${{ steps.paths.outputs.image }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.build-cache }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-build-${{ steps.paths.outputs.image }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.build-cache }}-${{ hashFiles('go.mod', 'go.sum') }}-
          go-build-${{ steps.paths.outputs.image }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.build-cache }}-
